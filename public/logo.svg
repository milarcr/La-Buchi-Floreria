<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Fondo círculo blanco con borde rojo -->
  <circle cx="60" cy="60" r="58" fill="white" stroke="#FF0000" stroke-width="3"/>

  <!-- Rosa estilizada (pétalos) -->
  <ellipse cx="60" cy="44" rx="8" ry="13" fill="#FF0000" transform="rotate(0 60 44)"/>
  <ellipse cx="60" cy="44" rx="8" ry="13" fill="#FF0000" transform="rotate(45 60 60)"/>
  <ellipse cx="60" cy="44" rx="8" ry="13" fill="#FF0000" transform="rotate(90 60 60)"/>
  <ellipse cx="60" cy="44" rx="8" ry="13" fill="#FF0000" transform="rotate(135 60 60)"/>
  <ellipse cx="60" cy="44" rx="8" ry="13" fill="#FF0000" transform="rotate(180 60 60)"/>
  <ellipse cx="60" cy="44" rx="8" ry="13" fill="#FF0000" transform="rotate(225 60 60)"/>
  <ellipse cx="60" cy="44" rx="8" ry="13" fill="#FF0000" transform="rotate(270 60 60)"/>
  <ellipse cx="60" cy="44" rx="8" ry="13" fill="#FF0000" transform="rotate(315 60 60)"/>

  <!-- Centro de la rosa -->
  <circle cx="60" cy="60" r="10" fill="#CC0000"/>
  <circle cx="60" cy="60" r="5"  fill="#FF0000"/>

  <!-- Tallo y hojas -->
  <rect x="58" y="70" width="4" height="16" rx="2" fill="#2d7a2d"/>
  <ellipse cx="52" cy="78" rx="6" ry="3" fill="#3a9c3a" transform="rotate(-30 52 78)"/>
  <ellipse cx="68" cy="81" rx="6" ry="3" fill="#3a9c3a" transform="rotate(30 68 81)"/>

  <!-- Texto LA BUCHI -->
  <text x="60" y="100" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="9.5" fill="#FF0000" letter-spacing="1">LA BUCHI</text>
  <!-- Texto FLORERÍA -->
  <text x="60" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="7.5" fill="#555555" letter-spacing="2">FLORERÍA</text>
</svg>
